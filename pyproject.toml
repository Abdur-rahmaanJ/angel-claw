[project]
name = "angel-claw"
version = "0.8.0"
description = "Angel Claw personal AI agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "angel-recall",
    "litellm",
    "croniter",
    "httpx",
    "python-telegram-bot",
    "telegram>=0.0.1",
    "aiohttp",
    "qrcode",
    "neonize",
    "mcp[cli]",
    "fastmcp",
    "questionary",
    "python-dateutil",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]
file-handler = [
    "PyPDF2",
    "Pillow",
    "pytesseract",
]
google-calendar = [
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
angel-claw = "angel_claw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
angel_claw = [".env.example"]

[tool.setuptools.packages.find]
where = ["src"]
