[project]
name = "angel-claw"
version = "0.11.0"
description = "Angel Claw personal AI agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "angel-recall",
    "litellm",
    "croniter",
    "httpx",
    "python-telegram-bot",
    "aiohttp",
    "qrcode",
    "neonize",
    "mcp[cli]",
    "fastmcp",
    "questionary",
    "python-dateutil",
    "shopyo>=4.16.0",
    "shopyo-base>=1.4.0",
    "shopyo-auth>=1.5.1",
    "shopyo-appadmin>=1.4.1",
    "shopyo-dashboard>=1.4.0",
    "shopyo-page>=1.3.0",
    "shopyo-i18n>=1.2.0",
    "shopyo-settings>=1.3.0",
    "shopyo-theme>=1.3.0",
    "asgiref>=3.11.1",
    "redis>=7.3.0",
    "sqlalchemy>=2.0.47",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]
file-handler = [
    "PyPDF2",
    "Pillow",
    "pytesseract",
]
google-calendar = [
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
angel-claw = "angel_claw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
angel_claw = [".env.example"]

[tool.setuptools.packages.find]
where = ["src"]
