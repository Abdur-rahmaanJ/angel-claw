<aside 
    id="sidebar" 
    class="fixed lg:static inset-y-0 left-0 w-72 bg-[var(--sidebar-bg)] border-r border-[var(--border-color)] z-[50] transition-transform duration-300 transform lg:translate-x-0"
    :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
>
    <div class="h-full flex flex-col p-6">
        <div class="flex items-center gap-3 mb-10 px-2">
            <img src="/static/wing.png" class="w-10 h-10 object-contain" alt="Angel Claw Icon">
            <div>
                <h1 class="font-black text-sm tracking-tighter uppercase">Angel Claw</h1>
            </div>
        </div>

        <nav class="flex-grow overflow-y-auto space-y-1">
            <div class="text-[10px] uppercase text-zinc-600 font-black tracking-[0.2em] mb-4 px-4">Main</div>
            
            <a href="javascript:void(0)" 
               class="nav-item" 
               :class="{ 'active': $store.viewManager.activeView === 'dashboard' }"
               hx-get="/view/dashboard" 
               hx-target="#main-view-container"
               hx-push-url="true"
               @click="sidebarOpen = false">
                <i class="fas fa-th-large w-5 text-center"></i> Dashboard
            </a>

            <div x-data="{ open: true }">
                <a href="javascript:void(0)" 
                   class="nav-item" 
                   :class="{ 'active': $store.viewManager.activeView === 'chat' }"
                   @click="open = !open; sidebarOpen = false"
                   hx-get="/view/chat"
                   hx-target="#main-view-container"
                   hx-push-url="true">
                    <i class="fas fa-comment-dots w-5 text-center"></i>
                    <span class="flex-grow">Chat</span>
                    <i class="fas fa-chevron-down text-[10px] opacity-50 transition-all duration-300" :class="{ '-rotate-90': !open }"></i>
                </a>

                <div x-show="open" x-collapse class="ml-4 mt-2 mb-4 border-l-2 border-zinc-800 pl-4 space-y-1">
                    <button @click="createNewThread()" class="w-full text-left px-3 py-1.5 rounded-md text-[13px] text-zinc-500 hover:text-accent hover:bg-accent/5 transition-all flex items-center gap-2 mb-2">
                        <i class="fas fa-plus-circle"></i> New Thread
                    </button>
                    <div id="threads-list" 
                         hx-get="/chat/sessions" 
                         hx-trigger="load, refresh-threads from:body" 
                         hx-vals='js:{current_session_id: Alpine.store("viewManager")?.currentSessionId || "Thread 1"}'
                         class="space-y-1">
                        <div class="p-4 flex justify-center"><i class="fas fa-spinner fa-spin text-zinc-700"></i></div>
                    </div>
                </div>
            </div>

            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'tasks' }" hx-get="/view/tasks" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-check-square w-5 text-center"></i> Tasks
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'calendar' }" hx-get="/view/calendar" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-calendar-alt w-5 text-center"></i> Calendar
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'messages' }" hx-get="/view/messages" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-inbox w-5 text-center"></i> Messages
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'soul' }" hx-get="/view/soul" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-dna w-5 text-center"></i> Soul
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'memory' }" hx-get="/view/memory" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-brain w-5 text-center"></i> Memory
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'api' }" hx-get="/view/api" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-code w-5 text-center"></i> API & MCP
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'integrations' }" hx-get="/view/integrations" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-plug w-5 text-center"></i> Integrations
            </a>
            <a href="javascript:void(0)" class="nav-item" :class="{ 'active': $store.viewManager.activeView === 'settings' }" hx-get="/view/settings" hx-target="#main-view-container" hx-push-url="true" @click="sidebarOpen = false">
                <i class="fas fa-cog w-5 text-center"></i> Settings
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-[var(--border-color)]">
            <div class="flex items-center gap-3 px-4 py-3 bg-black/20 rounded-2xl border border-zinc-800/50">
                <div class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center text-accent font-bold">
                    {{ current_user.email[0].upper() }}
                </div>
                <div class="flex-grow min-w-0">
                    <p class="text-[13px] font-bold truncate">{{ current_user.email }}</p>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-black">Connected</p>
                </div>
                <button @click="$store.viewManager.toggleTheme()" class="w-8 h-8 rounded-lg hover:bg-white/5 transition-colors text-zinc-500">
                    <i :class="$store.viewManager.theme === 'light' ? 'fas fa-sun' : 'fas fa-moon'"></i>
                </button>
            </div>
        </div>
    </div>
</aside>
