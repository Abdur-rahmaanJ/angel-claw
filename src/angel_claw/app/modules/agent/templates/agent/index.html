{% extends "agent/layout.html" %}

{% block content %}
    <div id="main-view-container">
        <div class="flex-grow flex items-center justify-center py-20">
            <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
        </div>
    </div>
    <script>
        // Load initial view after Alpine initializes
        document.addEventListener('alpine:init', () => {
            setTimeout(() => loadView('{{ active_view or "dashboard" }}'), 100);
        });
    </script>
{% endblock %}

{% block modals %}
    {{ super() }}
{% endblock %}
