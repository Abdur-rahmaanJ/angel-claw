<!DOCTYPE html>
<html lang="en" :class="$store.viewManager?.theme || 'dark'" x-data x-init="$store.viewManager?.init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Claw | Control Panel</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" id="theme-meta" :content="($store.viewManager?.theme || 'dark') === 'dark' ? '#09090b' : '#f4f4f5'">
    <link rel="icon" type="image/png" href="/static/wing.png">
    <link rel="apple-touch-icon" href="/static/wing.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="/static/js/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent-color)',
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        // Initialize Alpine placeholder before it loads
        window.Alpine = window.Alpine || {};
        
        window.formatContent = function(text) {
            if (!text) return '';
            try {
                return marked.parse(text, { breaks: true, gfm: true });
            } catch (e) {
                return text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
            }
        };

        window.copyToClipboard = function(text, event) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = event.currentTarget.querySelector('i');
                const oldClass = icon.className;
                icon.className = 'fas fa-check text-success-color';
                setTimeout(() => {
                    icon.className = oldClass;
                }, 2000);
            });
        };

        // Simple view loader using fetch
        async function loadView(viewName) {
            const container = document.getElementById('main-view-container');
            if (!container) return;
            
            try {
                const token = document.getElementById('csrf_token')?.value;
                const res = await fetch(`/view/${viewName}`, {
                    headers: { 'X-CSRFToken': token || '' }
                });
                if (res.ok) {
                    container.innerHTML = await res.text();
                    // Update active view in store
                    if (Alpine.store('viewManager')) {
                        Alpine.store('viewManager').activeView = viewName;
                    }
                }
            } catch (e) {
                console.error('Failed to load view:', e);
            }
        }
        
        // Define data functions before Alpine loads
        document.addEventListener('alpine:init', () => {
            Alpine.data('dashboardData', () => ({
                todosCount: '--', todosTotal: 0, eventsCount: '--', eventsDays: 7,
                credits: { balance: 0, limit: 1000, lifetime_spent: 0 },
                async init() {
                    await Promise.all([this.loadCredits(), this.loadTodos(), this.loadEvents()]);
                },
                async loadCredits() {
                    try { const r = await fetch('/credits'); const d = await r.json(); this.credits = d; } catch(e) { console.error(e); }
                },
                async loadTodos() {
                    try { const r = await fetch('/todos?format=json'); const d = await r.json(); this.todosCount = d.pending || 0; this.todosTotal = d.total || 0; } catch(e) { this.todosCount = 0; }
                },
                async loadEvents() {
                    try { const r = await fetch('/calendar?format=json'); const d = await r.json(); this.eventsCount = d.upcoming || 0; } catch(e) { this.eventsCount = 0; }
                }
            }));

            Alpine.data('tasksData', () => ({
                todos: [], loading: true,
                async init() { await this.loadTodos(); },
                async loadTodos() { try { const r = await fetch('/todos?format=json'); const d = await r.json(); this.todos = this.parseTodos(d.events || ''); } catch(e) { console.error(e); } finally { this.loading = false; } },
                parseTodos(text) { if (!text || text.includes('No todos')) return []; const lines = text.split('\n'), results = []; for (let i = 1; i < lines.length; i++) { const line = lines[i].trim(); if (line && !line.startsWith('##')) { const completed = line.includes('✅'); const content = line.replace(/^[✅⬜]\s*/, '').replace(/^\[\w+\]\s*\d+\.\s*/, ''); results.push({ id: i, content: content, completed: completed, priority: 'medium' }); } } return results; },
                async toggleTodo(id) { console.log('Toggle todo:', id); }
            }));

            Alpine.data('calendarData', () => ({
                events: [], loading: true,
                async init() { try { const r = await fetch('/calendar?format=json'); const d = await r.json(); this.events = d.events || []; } catch(e) { console.error(e); } finally { this.loading = false; } }
            }));

            Alpine.data('messagesData', () => ({
                messages: [], loading: true, modalOpen: false, selectedMessage: null,
                async init() { try { const r = await fetch('/messages?format=json'); const d = await r.json(); this.messages = d.messages || []; } catch(e) { console.error(e); } finally { this.loading = false; } },
                formatDate(ts) { if (!ts) return ''; try { return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e) { return ts; } },
                openMessage(msg) { this.selectedMessage = msg; this.modalOpen = true; },
                async markAsRead(id) { if (!id) return; try { const token = document.getElementById('csrf_token')?.value; await fetch(`/messages/mark-read/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); const msg = this.messages.find(m => m.id === id); if (msg) msg.is_read = true; } catch(e) { console.error(e); } },
                async deleteMsg(id) { if (!id || !confirm('Delete this message?')) return; try { const token = document.getElementById('csrf_token')?.value; await fetch(`/messages/delete/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); this.messages = this.messages.filter(m => m.id !== id); this.modalOpen = false; } catch(e) { console.error(e); } }
            }));

            Alpine.data('apiData', () => ({
                apiKeys: [], mcpServers: [], loading: true, showNewKeyForm: false,
                async init() { await Promise.all([this.loadApiKeys(), this.loadMcpServers()]); },
                async loadApiKeys() { try { const r = await fetch('/me'); const d = await r.json(); this.apiKeys = d.api_keys || []; } catch(e) { console.error(e); } },
                async loadMcpServers() { try { const r = await fetch('/system/mcp'); const d = await r.json(); this.mcpServers = d.servers || []; } catch(e) { console.error(e); } finally { this.loading = false; } },
                async revokeKey(id) { if (!confirm('Revoke this API key?')) return; try { const token = document.getElementById('csrf_token')?.value; await fetch(`/api-key/revoke/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); this.apiKeys = this.apiKeys.filter(k => k.id !== id); } catch(e) { console.error(e); } }
            }));

            Alpine.data('soulData', () => ({
                soulContent: '', loading: true, saving: false,
                async init() { try { const r = await fetch('/soul?format=json'); const d = await r.json(); this.soulContent = d.instruction || ''; } catch(e) { console.error(e); } finally { this.loading = false; } },
                async saveSoul() { this.saving = true; try { const token = document.getElementById('csrf_token')?.value; await fetch('/soul/update', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' }, body: JSON.stringify({ instruction: this.soulContent }) }); alert('Soul updated successfully!'); } catch(e) { alert('Error saving: ' + e.message); } finally { this.saving = false; } }
            }));

            Alpine.data('settingsData', () => ({
                showPasswordForm: false, passwords: { current: '', new: '' }, changing: false,
                theme: localStorage.getItem('theme') || 'dark',
                accent: localStorage.getItem('accent-color') || '#22c55e', assistantIcon: localStorage.getItem('assistant-icon') || 'fa-brain',
                toggleTheme(mode) { this.theme = mode; localStorage.setItem('theme', mode); document.documentElement.className = mode; },
                applyAccent(color) { this.accent = color; localStorage.setItem('accent-color', color); document.documentElement.style.setProperty('--accent-color', color); const rgb = this.hexToRgb(color); document.documentElement.style.setProperty('--accent-rgb', rgb); },
                hexToRgb(hex) { const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16); return `${r} ${g} ${b}`; },
                async changePassword() { this.changing = true; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch('/auth/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' }, body: JSON.stringify({ old_password: this.passwords.current, new_password: this.passwords.new }) }); if (r.ok) { alert('Password updated!'); this.showPasswordForm = false; this.passwords = { current: '', new: '' }; } else { alert('Failed to update password'); } } catch(e) { alert('Error: ' + e.message); } finally { this.changing = false; } }
            }));

            Alpine.data('integrationsData', () => ({
                integrations: {}, bridgeOnline: false, loading: true,
                async init() { try { const r = await fetch('/me'); const d = await r.json(); this.integrations = d.integrations || {}; this.bridgeOnline = d.bridge_online || false; } catch(e) { console.error(e); } finally { this.loading = false; } }
            }));

            Alpine.data('skillsData', () => ({
                skills: [], loading: true, configModal: false, configSkill: null, configFields: [],
                skillFieldDefs: {},
                config: {{ skill_config | tojson }},
                async init() { await this.loadSkills(); },
                async loadSkills() { 
                    try { const r = await fetch('/skills'); const d = await r.json(); 
                        this.skillFieldDefs = d.skill_field_defs || {};
                        this.skills = (d.skills || []).map(s => ({
                            ...s, 
                            enabled: !this.config[s.name]?.disabled,
                            has_config: !!this.skillFieldDefs[s.name]
                        })); 
                    } catch(e) { console.error(e); } 
                    finally { this.loading = false; } 
                },
                toggleSkill(name) { 
                    const skill = this.skills.find(s => s.name === name);
                    if (skill) {
                        skill.enabled = !skill.enabled;
                        const token = document.getElementById('csrf_token')?.value;
                        fetch('/skills/toggle', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' },
                            body: JSON.stringify({ skill: name, enabled: skill.enabled })
                        });
                    }
                },
                openConfig(skill) {
                    this.configSkill = skill;
                    const defs = this.skillFieldDefs[skill.name] || [];
                    const saved = this.config[skill.name]?.fields || {};
                    this.configFields = defs.map(f => ({
                        name: f.name,
                        type: f.type || 'text',
                        description: f.description || '',
                        value: saved[f.name] || ''
                    }));
                    this.configModal = true;
                },
                async saveConfig() {
                    if (!this.configSkill) return;
                    const fields = this.configFields.reduce((acc, f) => { acc[f.name] = f.value; return acc; }, {});
                    const token = document.getElementById('csrf_token')?.value;
                    await fetch('/skills/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' },
                        body: JSON.stringify({ skill: this.configSkill.name, fields })
                    });
                    this.configModal = false;
                },
                async uploadSkill(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const formData = new FormData();
                    formData.append('skill_file', file);
                    const token = document.getElementById('csrf_token')?.value;
                    try {
                        const r = await fetch('/skills/upload', {
                            method: 'POST',
                            headers: { 'X-CSRFToken': token || '' },
                            body: formData
                        });
                        const d = await r.json();
                        if (d.result === 'success') {
                            await this.loadSkills();
                        } else {
                            alert(d.error || 'Upload failed');
                        }
                    } catch(e) { console.error(e); alert('Upload failed'); }
                    event.target.value = '';
                }
            }));

            Alpine.data('memoryData', () => ({
                memories: [], loading: true, deleteModal: false, deleteTarget: null,
                async init() { await this.loadMemories(); },
                async loadMemories() { try { const sid = Alpine.store('viewManager')?.currentSessionId || 'Thread 1'; const r = await fetch(`/chat/memories?session_id=${encodeURIComponent(sid)}`); const d = await r.json(); this.memories = d.memories || []; } catch(e) { console.error(e); } finally { this.loading = false; } },
                confirmDelete(mem) { this.deleteTarget = mem; this.deleteModal = true; },
                async executeDelete() { if (!this.deleteTarget) return; try { const token = document.getElementById('csrf_token')?.value; await fetch(`/chat/memories/delete/${this.deleteTarget.id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); this.memories = this.memories.filter(m => m.id !== this.deleteTarget.id); } catch(e) { console.error(e); } finally { this.deleteModal = false; this.deleteTarget = null; } }
            }));

            Alpine.data('threadsData', () => ({
                sessions: [],
                async init() { 
                    await this.loadSessions();
                    document.body.addEventListener('refresh-threads', () => this.loadSessions());
                },
                async loadSessions() { 
                    try { 
                        const r = await fetch('/chat/sessions'); 
                        const d = await r.json(); 
                        this.sessions = d.sessions || []; 
                    } catch(e) { console.error(e); } 
                }
            }));
        });
        
        // Define chatInterface
        window.chatInterface = function() {
            return {
                userInput: '',
                messages: [],
                loadingHistory: false,
                streamingContent: '',
                devLogOpen: false,
                logs: [],

                async loadHistory() {
                    const sid = Alpine.store('viewManager')?.currentSessionId || "Thread 1";
                    this.loadingHistory = true;
                    try {
                        const res = await fetch(`/chat/history/${encodeURIComponent(sid)}`);
                        const data = await res.json();
                        this.messages = data.history || [];
                        this.$nextTick(() => this.scrollToBottom(true));
                    } catch (e) {
                        console.error("History load error", e);
                    } finally {
                        this.loadingHistory = false;
                    }
                },

                async sendMessage() {
                    const msg = this.userInput.trim();
                    const viewStore = Alpine.store('viewManager');
                    if (!msg || viewStore?.isStreaming) return;

                    this.messages.push({ role: 'user', content: msg });
                    this.userInput = '';
                    if (viewStore) viewStore.isStreaming = true;
                    this.streamingContent = '';
                    this.$nextTick(() => this.scrollToBottom(true));

                    try {
                        const sid = viewStore?.currentSessionId || "Thread 1";
                        const token = document.getElementById('csrf_token')?.value;
                        const res = await fetch('/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token },
                            body: JSON.stringify({ 
                                message: msg, 
                                session_id: sid,
                                use_global: viewStore?.useGlobalMemory
                            })
                        });

                        if (!res.ok) throw new Error('Failed to send message');

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder();

                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;

                            const container = this.$refs.messageContainer;
                            const wasAtBottom = container ? (container.scrollHeight - container.scrollTop - container.clientHeight < 20) : false;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');
                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (trimmed.startsWith('data: ')) {
                                    try {
                                        const data = JSON.parse(trimmed.slice(6));
                                        if (data.chunk) {
                                            if (data.chunk.startsWith('[TOOL_CALL:')) {
                                                this.logs.push(`<span class="text-accent">Executing:</span> ${data.chunk.replace('[TOOL_CALL:', '').replace(']', '')}`);
                                            } else {
                                                this.streamingContent += data.chunk;
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            
                            if (wasAtBottom && container) {
                                container.scrollTop = container.scrollHeight;
                            }
                        }
                        
                        this.messages.push({ role: 'assistant', content: this.streamingContent });
                        this.streamingContent = '';
                        document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                    } catch (err) {
                        this.messages.push({ role: 'assistant', content: 'Error: ' + err.message });
                    } finally {
                        if (viewStore) viewStore.isStreaming = false;
                        this.$nextTick(() => {
                            const container = this.$refs.messageContainer;
                            if (container && (container.scrollHeight - container.scrollTop - container.clientHeight < 100)) {
                                container.scrollTop = container.scrollHeight;
                            }
                        });
                    }
                },

                scrollToBottom(force = false) {
                    const container = this.$refs.messageContainer;
                    if (!container) return;
                    
                    const threshold = 40; // pixels from bottom
                    const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < threshold;
                    
                    if (force || isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                },

                toggleDevLog() {
                    this.devLogOpen = !this.devLogOpen;
                }
            };
        };
        
        // Alpine store initialization
        document.addEventListener('alpine:init', () => {
            Alpine.store('viewManager', {
                theme: localStorage.getItem('theme') || 'dark',
                accent: localStorage.getItem('accent-color') || '#22c55e',
                assistantIcon: localStorage.getItem('assistant-icon') || 'fa-brain',
                sidebarOpen: false,
                activeView: 'chat',
                currentSessionId: null,
                useGlobalMemory: localStorage.getItem('use-global-memory') === 'true',
                isStreaming: false,
                activeModal: null,
                pairingToken: '---',

                init() {
                    document.documentElement.className = this.theme;
                    this.applyAccent(this.accent);
                    this.generatePairingToken();
                    if (this.activeView === 'chat') {
                        this.createNewThread();
                    }
                },

                async generatePairingToken() {
                    try {
                        const token = document.getElementById('csrf_token')?.value;
                        const res = await fetch('/pair-token', { 
                            method: 'POST',
                            headers: { 'X-CSRFToken': token || '' }
                        });
                        if (!res.ok) throw new Error('Failed to generate token');
                        const data = await res.json();
                        this.pairingToken = data.token || '---';
                    } catch(e) { console.error('Failed to generate token:', e); }
                },

                openPairingModal() {
                    this.generatePairingToken();
                },

                async createNewThread() {
                    try {
                        const res = await fetch('/chat/sessions');
                        const data = await res.json();
                        const sessions = data.sessions || [];
                        let nextNum = 1;
                        sessions.forEach(s => {
                            if (s.id.startsWith('Thread ')) {
                                const num = parseInt(s.id.replace('Thread ', ''));
                                if (!isNaN(num) && num >= nextNum) nextNum = num + 1;
                            }
                        });
                        const newId = `Thread ${nextNum}`;
                        this.switchToThread(newId);
                        document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                    } catch (e) {
                        console.error("Error creating thread:", e);
                    }
                },

                switchToThread(id) {
                    this.currentSessionId = id;
                    this.isStreaming = false;
                    localStorage.setItem('current-session-id', id);
                    if (this.activeView !== 'chat') {
                        this.activeView = 'chat';
                        loadView('chat');
                    } else {
                        window.dispatchEvent(new CustomEvent('refresh-chat'));
                    }
                    document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                },

                toggleTheme() { 
                    this.theme = this.theme === 'dark' ? 'light' : 'dark'; 
                    localStorage.setItem('theme', this.theme);
                    document.documentElement.className = this.theme;
                },

                applyAccent(color) {
                    this.accent = color;
                    localStorage.setItem('accent-color', color);
                    const rgb = this.hexToRgb(color);
                    document.documentElement.style.setProperty('--accent-color', color);
                    document.documentElement.style.setProperty('--accent-rgb', rgb);
                },

                hexToRgb(hex) {
                    const r = parseInt(hex.slice(1,3), 16),
                          g = parseInt(hex.slice(3,5), 16),
                          b = parseInt(hex.slice(5,7), 16);
                    return `${r} ${g} ${b}`;
                },

                toggleSidebar() { this.sidebarOpen = !this.sidebarOpen; }
            });
        });
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --bg-color: #09090b;
                --sidebar-bg: #121214;
                --card-bg: #18181b;
                --text-primary: #fafafa;
                --text-secondary: #a1a1aa;
                --accent-color: #22c55e;
                --border-color: #27272a;
                --success-color: #10b981;
            }

            .light {
                --bg-color: #f4f4f5;
                --sidebar-bg: #ffffff;
                --card-bg: #ffffff;
                --text-primary: #18181b;
                --text-secondary: #71717a;
                --accent-color: #10b981;
                --border-color: #e4e4e7;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-primary);
                font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            
            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #3f3f46;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #52525b;
            }
            
            /* Firefox */
            * {
                scrollbar-width: thin;
                scrollbar-color: #3f3f46 transparent;
            }
            
            [x-cloak] { display: none !important; }
        }

        @layer components {
            .markdown-content {
                line-height: 1.6;
            }
            .markdown-content h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; display: block; }
            .markdown-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; display: block; }
            .markdown-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; display: block; }
            .markdown-content p { margin-bottom: 0.75rem; }
            .markdown-content p:last-child { margin-bottom: 0; }
            .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
            .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
            .markdown-content code { background-color: rgba(255, 255, 255, 0.1); padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem; }
            .markdown-content pre { background-color: rgba(0, 0, 0, 0.4); padding: 1rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.875rem; overflow-x: auto; margin-top: 1rem; margin-bottom: 1rem; border: 1px solid rgba(255, 255, 255, 0.05); }
            .markdown-content pre code { background-color: transparent; padding: 0; }
            .markdown-content blockquote { border-left: 4px solid var(--accent-color); padding-left: 1rem; font-style: italic; margin-top: 0.75rem; margin-bottom: 0.75rem; opacity: 0.8; }
            .markdown-content a { color: var(--accent-color); text-decoration: underline; }

            .nav-item {
                @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-zinc-500 hover:bg-white/[0.03] hover:text-zinc-300 transition-all duration-300 cursor-pointer mb-1 text-[13px] font-semibold relative overflow-hidden;
            }
            .nav-item.active {
                background-color: rgb(var(--accent-rgb) / 0.1);
                @apply text-accent;
            }
            .nav-item.active::before {
                content: '';
                @apply absolute left-0 top-1/4 bottom-1/4 w-1 bg-accent rounded-full;
            }
            .stat-card {
                @apply bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl p-6 transition-all hover:border-zinc-700;
            }
            .btn {
                @apply px-5 py-2.5 rounded-lg font-semibold cursor-pointer transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed;
            }
            .btn-primary {
                @apply bg-accent text-white hover:opacity-90;
            }
            .btn-secondary {
                @apply bg-zinc-800 text-white hover:bg-zinc-700;
            }
            .btn-danger {
                @apply bg-red-600 text-white hover:bg-red-700;
            }
            .view-header {
                @apply h-16 border-b border-[var(--border-color)] flex items-center justify-between px-4 md:px-8 backdrop-blur-md sticky top-0 z-30;
                background-color: color-mix(in srgb, var(--bg-color), transparent 20%);
            }
            .workspace {
                @apply flex-grow overflow-y-auto p-4 md:p-8 flex flex-col;
                animation: viewEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] overflow-hidden flex">
    <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
    
    <!-- Sidebar Placeholder -->
    {% include 'agent/_sidebar.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col min-w-0 relative">
        <!-- Sidebar Overlay (Mobile) -->
        <div 
            x-show="$store.viewManager.sidebarOpen" 
            @click="$store.viewManager.sidebarOpen = false"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[40] lg:hidden"
            x-cloak
        ></div>

        <div id="main-view-container" class="flex-grow flex flex-col min-h-0 overflow-hidden">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block modals %}
        <div x-show="$store.viewManager.activeModal === 'pairing'" x-cloak class="fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4 backdrop-blur-md">
            <div @click.away="$store.viewManager.activeModal = null" class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-3xl w-full max-w-[500px] p-8 animate-[viewEnter_0.3s_ease-out]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold">Pair a Channel</h3>
                    <button @click="$store.viewManager.activeModal = null" class="text-zinc-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div class="text-center">
                    <div class="text-[10px] font-black uppercase tracking-[0.3em] text-zinc-600 mb-2">Your Pairing Token</div>
                    <div x-text="$store.viewManager.pairingToken" class="w-full bg-black/40 border border-accent/20 text-accent py-5 rounded-2xl font-mono text-center text-3xl tracking-[0.5em] outline-none my-4 shadow-[0_0_30px_rgba(34,197,94,0.1)]">---</div>
                </div>

                <div class="bg-zinc-800/30 p-5 rounded-2xl text-[13px] border border-zinc-700/50 mt-6">
                    <p class="mb-3 opacity-80">Go to <a href="https://t.me/abdur_angelclaw_bot" target="_blank" class="text-accent font-bold hover:underline">@abdur_angelclaw_bot</a> on Telegram and send:</p>
                    <code class="text-white font-mono break-all text-sm bg-black/40 p-3 rounded-lg block">/pair <span x-text="$store.viewManager.pairingToken" class="font-bold text-accent"></span></code>
                </div>
                
                <div class="mt-10 flex gap-4">
                    <button class="btn btn-secondary flex-grow" @click="$store.viewManager.activeModal = null">Close</button>
                    <button class="btn btn-primary flex-grow" @click="$store.viewManager.openPairingModal()">New Token</button>
                </div>
            </div>
        </div>
    {% endblock %}
</body>
</html>
