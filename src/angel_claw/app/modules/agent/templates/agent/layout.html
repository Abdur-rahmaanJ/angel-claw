<!DOCTYPE html>
<html lang="en" :class="$store.viewManager?.theme || 'dark'" x-data x-init="$store.viewManager?.init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Claw | Control Panel</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" id="theme-meta" :content="($store.viewManager?.theme || 'dark') === 'dark' ? '#09090b' : '#f4f4f5'">
    <link rel="icon" type="image/png" href="/static/wing.png">
    <link rel="apple-touch-icon" href="/static/pwa/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
            crossorigin="anonymous"></script>
    
    <script src="/static/js/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent-color)',
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        // Initialize Alpine placeholder before it loads
        window.Alpine = window.Alpine || {};
        
        window.escapeHtml = function(text) {
            return String(text ?? '').replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        };

        // Model output and other users' messages are untrusted: strip active
        // markup before it reaches x-html.
        window.sanitizeHtml = function(html) {
            const tpl = document.createElement('template');
            tpl.innerHTML = html;
            const blocked = 'script,style,iframe,object,embed,form,link,meta,base,svg,math';
            tpl.content.querySelectorAll(blocked).forEach(function(el) { el.remove(); });
            tpl.content.querySelectorAll('*').forEach(function(el) {
                Array.from(el.attributes).forEach(function(attr) {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim().toLowerCase();
                    if (name.indexOf('on') === 0) { el.removeAttribute(attr.name); return; }
                    if (['href', 'src', 'xlink:href', 'action', 'formaction'].indexOf(name) !== -1 &&
                        /^(javascript|data|vbscript):/.test(value)) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            return tpl.innerHTML;
        };

        window.formatContent = function(text) {
            if (!text) return '';
            try {
                return window.sanitizeHtml(marked.parse(text, { breaks: true, gfm: true }));
            } catch (e) {
                return window.escapeHtml(text).replace(/\n/g, '<br>');
            }
        };

        window.copyToClipboard = function(text, event) {
            // Capture the icon synchronously: event.currentTarget is null
            // by the time the clipboard promise resolves.
            const btn = event && event.currentTarget ? event.currentTarget : null;
            const icon = btn ? btn.querySelector('i') : null;
            const oldClass = icon ? icon.className : null;
            navigator.clipboard.writeText(text).then(() => {
                if (!icon) return;
                icon.className = 'fas fa-check text-success-color';
                setTimeout(() => {
                    icon.className = oldClass;
                }, 2000);
            }).catch(() => {
                // Clipboard access is blocked on insecure origins and by some
                // browser settings; tell the user instead of failing silently.
                Alpine.store('ui')?.toast('Could not copy to clipboard', 'error');
            });
        };

        // Simple view loader using fetch
        async function loadView(viewName) {
            const container = document.getElementById('main-view-container');
            if (!container) return;
            
            try {
                const token = document.getElementById('csrf_token')?.value;
                const res = await fetch(`/view/${viewName}`, {
                    headers: { 'X-CSRFToken': token || '' }
                });
                if (res.redirected || res.status === 401) {
                    // Session expired: reload so the server can show the login page.
                    location.reload();
                    return;
                }
                if (!res.ok) {
                    Alpine.store('ui')?.toast('Could not load view', 'error');
                    return;
                }
                if (res.ok) {
                    const html = await res.text();
                    container.innerHTML = html;
                    
                    // Manually execute scripts in the loaded HTML
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => {
                            newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // Update active view in store + URL hash
                    if (Alpine.store('viewManager')) {
                        Alpine.store('viewManager').activeView = viewName;
                        history.replaceState(null, '', '#/' + viewName);
                    }
                }
            } catch (e) {
                console.error('Failed to load view:', e);
            }
        }
        
        // Define data functions before Alpine loads
        document.addEventListener('alpine:init', () => {
            // PWA install: captures the browser prompt and offers an Install button
            Alpine.data('pwaInstall', () => ({
                deferredPrompt: null,
                canInstall: false,
                init() {
                    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
                    this.canInstall = !standalone;
                    window.addEventListener('beforeinstallprompt', (e) => {
                        e.preventDefault();
                        this.deferredPrompt = e;
                        this.canInstall = true;
                    });
                    window.addEventListener('appinstalled', () => {
                        this.deferredPrompt = null;
                        this.canInstall = false;
                        Alpine.store('ui').toast('Angel Claw installed');
                    });
                },
                async install() {
                    if (!this.deferredPrompt) {
                        Alpine.store('ui').toast('Use your browser menu: Install app / Add to Home Screen', 'error');
                        return;
                    }
                    this.deferredPrompt.prompt();
                    const { outcome } = await this.deferredPrompt.userChoice;
                    if (outcome === 'accepted') Alpine.store('ui').toast('Installing Angel Claw...');
                    this.deferredPrompt = null;
                    this.canInstall = false;
                }
            }));
            Alpine.data('dashboardData', () => ({                todosCount: '--', todosTotal: 0, eventsCount: '--', eventsDays: 365,
                credits: { balance: 0, limit: 1000, lifetime_spent: 0 },
                creditsError: false, todosError: false, eventsError: false,
                async init() { await Promise.all([this.loadCredits(), this.loadTodos(), this.loadEvents()]); },
                async loadCredits() { this.creditsError = false; try { const r = await fetch('/credits'); if (!r.ok) throw new Error(); const d = await r.json(); this.credits = d; } catch(e) { this.creditsError = true; } },
                async loadTodos() { this.todosError = false; try { const r = await fetch('/todos?format=json'); if (!r.ok) throw new Error(); const d = await r.json(); this.todosCount = d.pending || 0; this.todosTotal = d.total || 0; } catch(e) { this.todosCount = 0; this.todosError = true; } },
                async loadEvents() { this.eventsError = false; try { const r = await fetch('/calendar?format=json'); if (!r.ok) throw new Error(); const d = await r.json(); this.eventsCount = d.upcoming || 0; } catch(e) { this.eventsCount = 0; this.eventsError = true; } }
            }));

            Alpine.data('tasksData', () => ({
                todos: [], jobs: [], loading: true, error: false,
                async init() { await Promise.all([this.loadTodos(), this.loadJobs()]); },
                async loadTodos() { this.error = false; try { const r = await fetch('/todos?format=json'); if (!r.ok) throw new Error(); const d = await r.json(); this.todos = d.todos || []; } catch(e) { this.error = true; } finally { this.loading = false; } },
                async loadJobs() { try { const r = await fetch('/cron/jobs'); if (!r.ok) throw new Error(); const d = await r.json(); this.jobs = d.jobs || []; } catch(e) { this.jobs = []; } },
                async toggleTodo(todo) { const token = document.getElementById('csrf_token')?.value; try { const r = await fetch(`/todos/${encodeURIComponent(todo.session)}/${todo.id}/toggle`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); await this.loadTodos(); } catch(e) { Alpine.store('ui').toast('Could not update task', 'error'); } },
                async deleteTodo(todo) { const token = document.getElementById('csrf_token')?.value; try { const r = await fetch(`/todos/${encodeURIComponent(todo.session)}/${todo.id}/delete`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); await this.loadTodos(); } catch(e) { Alpine.store('ui').toast('Could not delete task', 'error'); } },
                async toggleJob(job) { const token = document.getElementById('csrf_token')?.value; const r = await fetch(`/cron/jobs/${encodeURIComponent(job.name)}/toggle`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); const d = await r.json().catch(() => ({})); if (!r.ok) { Alpine.store('ui').toast(d.error || 'Could not update task', 'error'); return; } await this.loadJobs(); },
                async deleteJob(job) { const token = document.getElementById('csrf_token')?.value; try { const r = await fetch(`/cron/jobs/${encodeURIComponent(job.name)}/delete`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); await this.loadJobs(); } catch(e) { Alpine.store('ui').toast('Could not delete task', 'error'); } },
                formatDate(ts) { if (!ts) return '—'; try { return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e) { return ts; } }
            }));

            Alpine.data('calendarData', () => ({
                events: [], loading: true, error: false,
                async init() { try { const r = await fetch('/calendar?format=json'); if (!r.ok) throw new Error(); const d = await r.json(); this.events = d.events || []; } catch(e) { this.error = true; } finally { this.loading = false; } }
            }));

            Alpine.data('messagesData', () => ({
                messages: [], loading: true, error: false, modalOpen: false, selectedMessage: null,
                async init() { try { const r = await fetch('/messages?format=json'); if (!r.ok) throw new Error(); const d = await r.json(); this.messages = d.messages || []; } catch(e) { this.error = true; } finally { this.loading = false; } },
                formatDate(ts) { if (!ts) return ''; try { return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e) { return ts; } },
                openMessage(msg) { this.selectedMessage = msg; this.modalOpen = true; },
                async markAsRead(id) { if (!id) return; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch(`/messages/mark-read/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); const msg = this.messages.find(m => m.id === id); if (msg) msg.is_read = true; } catch(e) { Alpine.store('ui').toast('Could not mark message as read', 'error'); } },
                async deleteMsg(id) { if (!id) return; if (!await Alpine.store('ui').confirm({ title: 'Delete message?', danger: true, confirmText: 'Delete' })) return; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch(`/messages/delete/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); this.messages = this.messages.filter(m => m.id !== id); this.modalOpen = false; Alpine.store('ui').toast('Message deleted'); } catch(e) { Alpine.store('ui').toast('Failed to delete message', 'error'); } }
            }));

            Alpine.data('apiData', () => ({
                apiKeys: [], mcpServers: [], loading: true, showNewKeyForm: false,
                newKeyName: '', creating: false, createdKey: '',
                async init() { await Promise.all([this.loadApiKeys(), this.loadMcpServers()]); },
                async loadApiKeys() { try { const r = await fetch('/me'); if (!r.ok) throw new Error(); const d = await r.json(); this.apiKeys = d.api_keys || []; } catch(e) { console.error(e); } },
                async loadMcpServers() { try { const r = await fetch('/system/mcp'); if (!r.ok) throw new Error(); const d = await r.json(); this.mcpServers = d.servers || []; } catch(e) { console.error(e); } finally { this.loading = false; } },
                async createKey() {
                    const name = (this.newKeyName || '').trim();
                    if (!name) { Alpine.store('ui').toast('Give the key a name first', 'error'); return; }
                    this.creating = true;
                    try {
                        const token = document.getElementById('csrf_token')?.value;
                        const r = await fetch('/api-key', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' }, body: JSON.stringify({ name }) });
                        const d = await r.json();
                        if (!r.ok) throw new Error(d.error || 'Failed to create key');
                        this.createdKey = d.key;
                        this.showNewKeyForm = false;
                        this.newKeyName = '';
                        await this.loadApiKeys();
                    } catch(e) { Alpine.store('ui').toast(e.message || 'Failed to create key', 'error'); }
                    finally { this.creating = false; }
                },
                async revokeKey(id) { if (!id) return; if (!await Alpine.store('ui').confirm({ title: 'Revoke API key?', message: 'Apps using this key will lose access immediately.', danger: true, confirmText: 'Revoke' })) return; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch(`/api-key/revoke/${id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); this.apiKeys = this.apiKeys.filter(k => k.id !== id); Alpine.store('ui').toast('API key revoked'); } catch(e) { Alpine.store('ui').toast('Failed to revoke key', 'error'); } }
            }));

            Alpine.data('soulData', () => ({
                soulContent: '', loading: true, saving: false,
                async init() { try { const r = await fetch('/soul?format=json'); const d = await r.json(); this.soulContent = d.instruction || ''; } catch(e) { console.error(e); } finally { this.loading = false; } },
                async saveSoul() { this.saving = true; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch('/soul/update', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' }, body: JSON.stringify({ instruction: this.soulContent }) }); if (!r.ok) throw new Error('Save failed'); Alpine.store('ui').toast('Soul updated successfully!'); } catch(e) { Alpine.store('ui').toast('Error saving: ' + e.message, 'error'); } finally { this.saving = false; } }
            }));

            Alpine.data('settingsData', () => ({
                showPasswordForm: false, passwords: { current: '', new: '' }, changing: false,
                theme: localStorage.getItem('theme') || 'dark',
                accent: localStorage.getItem('accent-color') || '#22c55e', assistantIcon: localStorage.getItem('assistant-icon') || 'fa-brain',
                notificationStatus: Notification.permission,
                toggleTheme(mode) { this.theme = mode; localStorage.setItem('theme', mode); document.documentElement.className = mode; },
                applyAccent(color) { this.accent = color; localStorage.setItem('accent-color', color); document.documentElement.style.setProperty('--accent-color', color); const rgb = this.hexToRgb(color); document.documentElement.style.setProperty('--accent-rgb', rgb); },
                hexToRgb(hex) { const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16); return `${r} ${g} ${b}`; },
                async changePassword() { this.changing = true; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch('/auth/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' }, body: JSON.stringify({ old_password: this.passwords.current, new_password: this.passwords.new }) }); if (r.ok) { Alpine.store('ui').toast('Password updated!'); this.showPasswordForm = false; this.passwords = { current: '', new: '' }; } else { Alpine.store('ui').toast('Failed to update password', 'error'); } } catch(e) { Alpine.store('ui').toast('Error: ' + e.message, 'error'); } finally { this.changing = false; } },
                requestNotificationPermission() {
                    Notification.requestPermission().then(permission => {
                        this.notificationStatus = permission;
                        if (permission === "granted") {
                            new Notification("Angel Claw", { body: "Notifications enabled successfully!", icon: "/static/wing.png" });
                        }
                    });
                }
            }));

            Alpine.data('integrationsData', () => ({
                integrations: {}, bridgeOnline: false, loading: true,
                async init() { try { const r = await fetch('/me'); const d = await r.json(); this.integrations = d.integrations || {}; this.bridgeOnline = d.bridge_online || false; } catch(e) { console.error(e); } finally { this.loading = false; } }
            }));

            Alpine.data('skillsData', () => ({
                skills: [], loading: true, configModal: false, configSkill: null, configFields: [],
                skillFieldDefs: {},
                config: {{ skill_config | tojson }},
                async init() { await this.loadSkills(); },
                async loadSkills() { 
                    try { const r = await fetch('/skills'); const d = await r.json(); 
                        this.skillFieldDefs = d.skill_field_defs || {};
                        this.skills = (d.skills || []).map(s => ({
                            ...s, 
                            enabled: !this.config[s.name]?.disabled,
                            has_config: !!this.skillFieldDefs[s.name]
                        })); 
                    } catch(e) { console.error(e); } 
                    finally { this.loading = false; } 
                },
                toggleSkill(name) { 
                    const skill = this.skills.find(s => s.name === name);
                    if (skill) {
                        skill.enabled = !skill.enabled;
                        const token = document.getElementById('csrf_token')?.value;
                        fetch('/skills/toggle', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' },
                            body: JSON.stringify({ skill: name, enabled: skill.enabled })
                        });
                    }
                },
                async openConfig(skill) {
                    const name = skill.name;
                    this.configSkill = skill;
                    const defs = this.skillFieldDefs[name] || [];
                    // Saved values (possibly credentials) are fetched on demand
                    // instead of being embedded in the dashboard HTML.
                    let saved = {};
                    try {
                        const r = await fetch(`/skills/config/${encodeURIComponent(name)}`);
                        // A blank form would let Save overwrite settings that
                        // exist but could not be read, so refuse to open.
                        if (!r.ok) throw new Error();
                        saved = (await r.json()).fields || {};
                    } catch(e) {
                        if (this.configSkill?.name === name) {
                            this.configSkill = null;
                            Alpine.store('ui').toast('Could not load saved skill settings', 'error');
                        }
                        return;
                    }
                    // A later click may have opened another skill while this
                    // request was in flight; its fields must not be replaced.
                    if (this.configSkill?.name !== name) return;
                    this.configFields = defs.map(f => ({
                        name: f.name,
                        type: f.type || 'text',
                        description: f.description || '',
                        value: saved[f.name] || ''
                    }));
                    this.configModal = true;
                },
                async saveConfig() {
                    if (!this.configSkill) return;
                    const fields = this.configFields.reduce((acc, f) => { acc[f.name] = f.value; return acc; }, {});
                    const token = document.getElementById('csrf_token')?.value;
                    try {
                        const r = await fetch('/skills/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token || '' },
                            body: JSON.stringify({ skill: this.configSkill.name, fields })
                        });
                        if (!r.ok) throw new Error();
                    } catch(e) {
                        Alpine.store('ui').toast('Could not save skill settings', 'error');
                        return;
                    }
                    this.configModal = false;
                },
                async uploadSkill(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const formData = new FormData();
                    formData.append('skill_file', file);
                    const token = document.getElementById('csrf_token')?.value;
                    try {
                        const r = await fetch('/skills/upload', {
                            method: 'POST',
                            headers: { 'X-CSRFToken': token || '' },
                            body: formData
                        });
                        const d = await r.json();
                        if (d.result === 'success') {
                            await this.loadSkills();
                        } else {
                            Alpine.store('ui').toast(d.error || 'Upload failed', 'error');
                        }
                    } catch(e) { console.error(e); Alpine.store('ui').toast('Upload failed', 'error'); }
                    event.target.value = '';
                }
            }));

            Alpine.data('memoryData', () => ({
                memories: [], loading: true, error: false, deleteModal: false, deleteTarget: null,
                async init() { await this.loadMemories(); },
                async loadMemories() { this.error = false; try { const sid = Alpine.store('viewManager')?.currentSessionId || 'Thread 1'; const r = await fetch(`/chat/memories?session_id=${encodeURIComponent(sid)}`); if (!r.ok) throw new Error(); const d = await r.json(); this.memories = d.memories || []; } catch(e) { this.error = true; } finally { this.loading = false; } },
                confirmDelete(mem) { this.deleteTarget = mem; this.deleteModal = true; },
                async executeDelete() { if (!this.deleteTarget) return; try { const token = document.getElementById('csrf_token')?.value; const r = await fetch(`/chat/memories/delete/${this.deleteTarget.id}`, { method: 'POST', headers: { 'X-CSRFToken': token || '' } }); if (!r.ok) throw new Error(); this.memories = this.memories.filter(m => m.id !== this.deleteTarget.id); } catch(e) { Alpine.store('ui').toast('Could not delete memory', 'error'); } finally { this.deleteModal = false; this.deleteTarget = null; } }
            }));

            Alpine.data('threadsData', () => ({
                sessions: [],
                async init() { 
                    await this.loadSessions();
                    document.body.addEventListener('refresh-threads', () => this.loadSessions());
                },
                async loadSessions() { 
                    try { 
                        const r = await fetch('/chat/sessions'); 
                        const d = await r.json(); 
                        this.sessions = d.sessions || []; 
                    } catch(e) { console.error(e); } 
                }
            }));
        });
        
        // Define chatInterface
        window.chatInterface = function() {
            return {
                userInput: '',
                messages: [],
                loadingHistory: false,
                streamingContent: '',
                devLogOpen: false,
                logs: [],
                streamAbort: null,

                cancelStream() {
                    if (!this.streamAbort) return;
                    this.streamAbort.abort();
                    this.streamAbort = null;
                    this.streamingContent = '';
                },

                async loadHistory() {
                    const sid = Alpine.store('viewManager')?.currentSessionId || "Thread 1";
                    this.loadingHistory = true;
                    try {
                        const res = await fetch(`/chat/history/${encodeURIComponent(sid)}`);
                        const data = await res.json();
                        this.messages = data.history || [];
                        this.$nextTick(() => this.scrollToBottom(true));
                    } catch (e) {
                        console.error("History load error", e);
                    } finally {
                        this.loadingHistory = false;
                    }
                },

                async sendMessage() {
                    const msg = this.userInput.trim();
                    const viewStore = Alpine.store('viewManager');
                    if (!msg || viewStore?.isStreaming) return;

                    this.messages.push({ role: 'user', content: msg });
                    this.userInput = '';
                    if (viewStore) viewStore.isStreaming = true;
                    this.streamingContent = '';
                    this.streamAbort = new AbortController();
                    this.$nextTick(() => this.scrollToBottom(true));

                    try {
                        const sid = viewStore?.currentSessionId || "Thread 1";
                        const token = document.getElementById('csrf_token')?.value;
                        const res = await fetch('/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream', 'X-CSRFToken': token },
                            signal: this.streamAbort.signal,
                            body: JSON.stringify({ 
                                message: msg, 
                                session_id: sid,
                                use_global: viewStore?.useGlobalMemory
                            })
                        });

                        if (res.redirected || res.status === 401) {
                            throw new Error('Your session expired. Reload the page to sign in again.');
                        }
                        if (!res.ok) throw new Error('Failed to send message');
                        if (!(res.headers.get('content-type') || '').includes('text/event-stream')) {
                            throw new Error('Your session expired. Reload the page to sign in again.');
                        }

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        // A data line can be split across network reads, so only
                        // consume complete lines and keep the remainder buffered.
                        const handleLine = (line) => {
                            const trimmed = line.trim();
                            if (!trimmed.startsWith('data:')) return;
                            const payload = trimmed.slice(5).trim();
                            if (!payload || payload === '[DONE]') return;
                            let data;
                            try { data = JSON.parse(payload); } catch (e) { return; }
                            if (!data.chunk) return;
                            if (data.chunk.startsWith('[TOOL_CALL:')) {
                                this.logs.push(`<span class="text-accent">Executing:</span> ${window.escapeHtml(data.chunk.replace('[TOOL_CALL:', '').replace(']', ''))}`);
                            } else {
                                this.streamingContent += data.chunk;
                            }
                        };

                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;

                            const container = this.$refs.messageContainer;
                            const wasAtBottom = container ? (container.scrollHeight - container.scrollTop - container.clientHeight < 20) : false;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();
                            lines.forEach(handleLine);

                            if (wasAtBottom && container) {
                                container.scrollTop = container.scrollHeight;
                            }
                        }
                        buffer += decoder.decode();
                        if (buffer.trim()) handleLine(buffer);

                        if (this.streamingContent.trim()) {
                            this.messages.push({ role: 'assistant', content: this.streamingContent });
                        }
                        this.streamingContent = '';
                        document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            // The user left this thread; drop the partial reply
                            // instead of appending it to another conversation.
                            this.streamingContent = '';
                        } else {
                            if (this.streamingContent.trim()) {
                                this.messages.push({ role: 'assistant', content: this.streamingContent });
                                this.streamingContent = '';
                            }
                            this.messages.push({ role: 'assistant', content: 'Error: ' + err.message });
                            Alpine.store('ui').toast(err.message, 'error');
                        }
                    } finally {
                        this.streamAbort = null;
                        if (viewStore) viewStore.isStreaming = false;
                        this.$nextTick(() => {
                            const container = this.$refs.messageContainer;
                            if (container && (container.scrollHeight - container.scrollTop - container.clientHeight < 100)) {
                                container.scrollTop = container.scrollHeight;
                            }
                        });
                    }
                },

                scrollToBottom(force = false) {
                    const container = this.$refs.messageContainer;
                    if (!container) return;
                    
                    const threshold = 40; // pixels from bottom
                    const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < threshold;
                    
                    if (force || isAtBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                },

                toggleDevLog() {
                    this.devLogOpen = !this.devLogOpen;
                }
            };
        };
        
        // Alpine store initialization
        document.addEventListener('alpine:init', () => {
            Alpine.store('ui', {
                toasts: [],
                confirmOpen: false,
                confirmOpts: {},
                _confirmResolve: null,
                toast(msg, type = 'success') {
                    const id = Date.now() + Math.random();
                    this.toasts.push({ id, msg, type });
                    setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3500);
                },
                confirm(opts = {}) {
                    this.confirmOpts = Object.assign({ title: 'Are you sure?', message: '', confirmText: 'Confirm', danger: false }, opts);
                    this.confirmOpen = true;
                    return new Promise(res => { this._confirmResolve = res; });
                },
                answer(val) {
                    this.confirmOpen = false;
                    if (this._confirmResolve) { this._confirmResolve(val); this._confirmResolve = null; }
                }
            });

            Alpine.store('viewManager', {
                theme: localStorage.getItem('theme') || 'dark',
                accent: localStorage.getItem('accent-color') || '#22c55e',
                assistantIcon: localStorage.getItem('assistant-icon') || 'fa-brain',
                sidebarOpen: false,
                activeView: 'chat',
                currentSessionId: null,
                useGlobalMemory: localStorage.getItem('use-global-memory') === 'true',
                isStreaming: false,
                activeModal: null,
                pairingToken: '---',
                notificationTimer: null,
                unreadMessages: 0,
                notifiedMessageIds: new Set(),
                notifiedReminderIds: new Set(),

                init() {
                    document.documentElement.className = this.theme;
                    this.applyAccent(this.accent);

                    // Load view from URL hash (default: chat)
                    const validViews = ['dashboard','chat','tasks','calendar','messages','reminders','soul','memory','skills','api','usage','integrations','settings'];
                    const hashView = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
                    this.activeView = validViews.includes(hashView) ? hashView : 'chat';
                    loadView(this.activeView).then(() => {
                        // Keep the conversation the user was in before a reload
                        // instead of silently starting a brand new thread.
                        const storedThread = localStorage.getItem('current-session-id');
                        if (storedThread) {
                            this.switchToThread(storedThread);
                        } else {
                            this.createNewThread();
                        }
                    });
                    window.addEventListener('hashchange', () => {
                        const v = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
                        if (validViews.includes(v) && v !== this.activeView) loadView(v);
                    });

                    // Start notification poller
                    this.startNotificationPoller();
                },

                startNotificationPoller() {
                    if (this.notificationTimer) clearInterval(this.notificationTimer);
                    this.notificationTimer = setInterval(() => {
                        this.checkNotifications();
                        this.checkReminderNotifications();
                    }, 30000);
                    // Also check immediately
                    this.checkNotifications();
                    this.checkReminderNotifications();
                },

                async checkReminderNotifications() {
                    try {
                        const r = await fetch('/reminders?format=json');
                        if (!r.ok) return;
                        const d = await r.json();
                        const now = Date.now();
                        for (const reminder of d.reminders || []) {
                            if (!reminder.is_sent) continue;
                            const due = Date.parse(reminder.remind_at);
                            // Only announce reminders that just fired; older ones
                            // were already seen before this page was opened.
                            if (Number.isNaN(due) || now - due > 5 * 60 * 1000) continue;
                            if (this.notifiedReminderIds.has(reminder.id)) continue;
                            this.notifiedReminderIds.add(reminder.id);
                            Alpine.store('ui').toast('🔔 ' + reminder.message);
                            if (Notification.permission === 'granted') {
                                new Notification('Angel Claw Reminder', {
                                    body: reminder.message,
                                    icon: '/static/wing.png',
                                    tag: 'angelclaw-reminder-' + reminder.id
                                });
                            }
                        }
                    } catch(e) { console.error('Reminder notification check error', e); }
                },

                async checkNotifications() {
                    try {
                        const r = await fetch('/messages?format=json');
                        if (!r.ok) return;
                        const d = await r.json();
                        const unread = (d.messages || []).filter(m => !m.is_read);
                        this.unreadMessages = unread.length;

                        if (Notification.permission !== "granted") return;

                        for (const msg of unread) {
                            // Notify once per message per page load; the poll runs
                            // every 30s and unread items stay unread on purpose.
                            if (this.notifiedMessageIds.has(msg.id)) continue;
                            this.notifiedMessageIds.add(msg.id);
                            new Notification("Angel Claw Reminder", {
                                body: msg.content.replace('🔔 REMINDER: ', ''),
                                icon: "/static/wing.png",
                                tag: 'angelclaw-' + msg.id
                            });
                        }
                    } catch(e) { console.error("Notification check error", e); }
                },

                async generatePairingToken() {

                    try {
                        const token = document.getElementById('csrf_token')?.value;
                        const res = await fetch('/pair-token', { 
                            method: 'POST',
                            headers: { 'X-CSRFToken': token || '' }
                        });
                        if (!res.ok) throw new Error('Failed to generate token');
                        const data = await res.json();
                        this.pairingToken = data.token || '---';
                    } catch(e) { console.error('Failed to generate token:', e); }
                },

                openPairingModal() {
                    // Tokens expire after five minutes, so only mint one when the
                    // user actually opens the pairing dialog.
                    this.pairingToken = '---';
                    this.activeModal = 'pairing';
                    return this.generatePairingToken();
                },

                async createNewThread() {
                    try {
                        const res = await fetch('/chat/sessions');
                        const data = await res.json();
                        const sessions = data.sessions || [];
                        let nextNum = 1;
                        sessions.forEach(s => {
                            if (s.id.startsWith('Thread ')) {
                                const num = parseInt(s.id.replace('Thread ', ''));
                                if (!isNaN(num) && num >= nextNum) nextNum = num + 1;
                            }
                        });
                        const newId = `Thread ${nextNum}`;
                        this.switchToThread(newId);
                        document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                    } catch (e) {
                        console.error("Error creating thread:", e);
                    }
                },

                async switchToThread(id) {
                    this.currentSessionId = id;
                    this.isStreaming = false;
                    localStorage.setItem('current-session-id', id);
                    if (this.activeView !== 'chat') {
                        this.activeView = 'chat';
                        await loadView('chat');
                    } else {
                        window.dispatchEvent(new CustomEvent('refresh-chat'));
                    }
                    document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                },

                toggleTheme() { 
                    this.theme = this.theme === 'dark' ? 'light' : 'dark'; 
                    localStorage.setItem('theme', this.theme);
                    document.documentElement.className = this.theme;
                },

                applyAccent(color) {
                    this.accent = color;
                    localStorage.setItem('accent-color', color);
                    const rgb = this.hexToRgb(color);
                    document.documentElement.style.setProperty('--accent-color', color);
                    document.documentElement.style.setProperty('--accent-rgb', rgb);
                },

                hexToRgb(hex) {
                    const r = parseInt(hex.slice(1,3), 16),
                          g = parseInt(hex.slice(3,5), 16),
                          b = parseInt(hex.slice(5,7), 16);
                    return `${r} ${g} ${b}`;
                },

                toggleSidebar() { this.sidebarOpen = !this.sidebarOpen; }
            });
        });
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --bg-color: #09090b;
                --sidebar-bg: #121214;
                --card-bg: #18181b;
                --text-primary: #fafafa;
                --text-secondary: #a1a1aa;
                --accent-color: #22c55e;
                --border-color: #27272a;
                --success-color: #10b981;
            }

            .light {
                --bg-color: #f4f4f5;
                --sidebar-bg: #ffffff;
                --card-bg: #ffffff;
                --text-primary: #18181b;
                --text-secondary: #71717a;
                --accent-color: #10b981;
                --border-color: #e4e4e7;
            }

            body {
                background-color: var(--bg-color);

            }
            
            /* Custom Scrollbar */

                width: 8px;
                height: 8px;
            }

                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #3f3f46;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #52525b;
            }
            
            /* Firefox */
            * {
                scrollbar-width: thin;
                scrollbar-color: #3f3f46 transparent;
            }
            
            [x-cloak] { display: none !important; }
        }

        @layer components {
            .markdown-content {
                line-height: 1.6;
            }
            .markdown-content h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; display: block; }
            .markdown-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; display: block; }
            .markdown-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; display: block; }
            .markdown-content p { margin-bottom: 0.75rem; }
            .markdown-content p:last-child { margin-bottom: 0; }
            .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
            .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
            .markdown-content code { background-color: rgba(255, 255, 255, 0.1); padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem; }
            .markdown-content pre { background-color: rgba(0, 0, 0, 0.4); padding: 1rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.875rem; overflow-x: auto; margin-top: 1rem; margin-bottom: 1rem; border: 1px solid rgba(255, 255, 255, 0.05); }
            .markdown-content pre code { background-color: transparent; padding: 0; }
            .markdown-content blockquote { border-left: 4px solid var(--accent-color); padding-left: 1rem; font-style: italic; margin-top: 0.75rem; margin-bottom: 0.75rem; opacity: 0.8; }
            .markdown-content a { color: var(--accent-color); text-decoration: underline; }

            .nav-item {
                @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-zinc-500 hover:bg-white/[0.03] hover:text-zinc-300 transition-all duration-300 cursor-pointer mb-1 text-[13px] font-semibold relative overflow-hidden;
            }
            .nav-item.active {
                background-color: rgb(var(--accent-rgb) / 0.1);
                @apply text-accent;
            }
            .nav-item.active::before {
                content: '';
                @apply absolute left-0 top-1/4 bottom-1/4 w-1 bg-accent rounded-full;
            }
            .stat-card {
                @apply bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl p-6 transition-all hover:border-zinc-700;
            }
            .btn {
                @apply px-5 py-2.5 rounded-lg font-semibold cursor-pointer transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed;
            }
            .btn-primary {
                @apply bg-accent text-white hover:opacity-90;
            }
            .btn-secondary {
                @apply bg-zinc-800 text-white hover:bg-zinc-700;
            }
            .btn-danger {
                @apply bg-red-600 text-white hover:bg-red-700;
            }
            .view-header {
                @apply h-16 border-b border-[var(--border-color)] flex items-center justify-between px-4 md:px-8 backdrop-blur-md sticky top-0 z-30;
                background-color: color-mix(in srgb, var(--bg-color), transparent 20%);
            }
            .workspace {
                @apply flex-grow overflow-y-auto p-4 md:p-8 flex flex-col;
                animation: viewEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            .toast {
                @apply px-4 py-3 rounded-xl text-sm font-semibold shadow-lg border backdrop-blur-md;
                animation: fadeIn 0.2s ease-out;
            }
            .toast-success { @apply bg-emerald-500/15 text-emerald-400 border-emerald-500/30; }
            .toast-error { @apply bg-red-500/15 text-red-400 border-red-500/30; }
            .toast-info { @apply bg-zinc-800 text-zinc-200 border-zinc-700; }
            .skeleton {
                @apply bg-white/5 rounded-xl animate-pulse;
            }
            .load-error {
                @apply text-center py-10 text-sm text-zinc-500;
            }
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-[100dvh] overflow-hidden flex">
    <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
    
    <!-- Sidebar Placeholder -->
    {% include 'agent/_sidebar.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col min-w-0 relative">
        <!-- Sidebar Overlay (Mobile) -->
        <div 
            x-show="$store.viewManager.sidebarOpen" 
            @click="$store.viewManager.sidebarOpen = false"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[40] lg:hidden"
            x-cloak
        ></div>

        <div id="main-view-container" class="flex-grow flex flex-col min-h-0 overflow-hidden">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toasts -->
    <div class="fixed bottom-6 right-6 z-[2000] space-y-3" x-data>
        <template x-for="t in $store.ui.toasts" :key="t.id">
            <div class="toast" :class="'toast-' + t.type" x-text="t.msg"></div>
        </template>
    </div>

    <!-- Confirm Modal -->
    <div x-data x-show="$store.ui.confirmOpen" x-cloak class="fixed inset-0 bg-black/80 z-[2000] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl p-6 max-w-sm w-full" @click.away="$store.ui.answer(false)">
            <h3 class="text-lg font-bold mb-2" x-text="$store.ui.confirmOpts.title"></h3>
            <p class="text-sm text-zinc-400 mb-6" x-text="$store.ui.confirmOpts.message"></p>
            <div class="flex gap-3">
                <button class="flex-1 btn btn-secondary" @click="$store.ui.answer(false)">Cancel</button>
                <button class="flex-1 btn" :class="$store.ui.confirmOpts.danger ? 'btn-danger' : 'btn-primary'" @click="$store.ui.answer(true)" x-text="$store.ui.confirmOpts.confirmText"></button>
            </div>
        </div>
    </div>

    {% block modals %}
        <div x-show="$store.viewManager.activeModal === 'pairing'" x-cloak class="fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4 backdrop-blur-md">
            <div @click.away="$store.viewManager.activeModal = null" class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-3xl w-full max-w-[500px] p-8 animate-[viewEnter_0.3s_ease-out]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold">Pair a Channel</h3>
                    <button @click="$store.viewManager.activeModal = null" class="text-zinc-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div class="text-center">
                    <div class="text-[10px] font-black uppercase tracking-[0.3em] text-zinc-600 mb-2">Your Pairing Token</div>
                    <div x-text="$store.viewManager.pairingToken" class="w-full bg-black/40 border border-accent/20 text-accent py-5 rounded-2xl font-mono text-center text-3xl tracking-[0.5em] outline-none my-4 shadow-[0_0_30px_rgba(34,197,94,0.1)]">---</div>
                </div>

                <div class="bg-zinc-800/30 p-5 rounded-2xl text-[13px] border border-zinc-700/50 mt-6">
                    <p class="mb-3 opacity-80">Go to <a href="https://t.me/abdur_angelclaw_bot" target="_blank" class="text-accent font-bold hover:underline">@abdur_angelclaw_bot</a> on Telegram and send:</p>
                    <code class="text-white font-mono break-all text-sm bg-black/40 p-3 rounded-lg block">/pair <span x-text="$store.viewManager.pairingToken" class="font-bold text-accent"></span></code>
                </div>
                
                <div class="mt-10 flex gap-4">
                    <button class="btn btn-secondary flex-grow" @click="$store.viewManager.activeModal = null">Close</button>
                    <button class="btn btn-primary flex-grow" @click="$store.viewManager.openPairingModal()">New Token</button>
                </div>
            </div>
        </div>
    {% endblock %}

    <script>
        // Register the root-scope service worker (offline shell + installability)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
