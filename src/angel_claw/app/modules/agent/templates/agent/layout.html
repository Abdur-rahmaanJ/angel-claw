<!DOCTYPE html>
<html lang="en" :class="theme" x-data="viewManager()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Claw | Control Panel</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" id="theme-meta" :content="theme === 'dark' ? '#09090b' : '#f4f4f5'">
    <link rel="icon" type="image/png" href="/static/wing.png">
    <link rel="apple-touch-icon" href="/static/wing.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/static/js/tailwind.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        if (window.tailwind) {
            window.tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            accent: 'rgb(var(--accent-rgb) / <alpha-value>)',
                        }
                    }
                }
            };
        }

        function viewManager() {
            return {
                theme: localStorage.getItem('theme') || 'dark',
                accent: localStorage.getItem('accent-color') || '#22c55e',
                assistantIcon: localStorage.getItem('assistant-icon') || 'fa-brain',
                sidebarOpen: false,
                activeView: '{{ active_view or "dashboard" }}',
                currentSessionId: localStorage.getItem('current-session-id') || 'Thread 1',
                useGlobalMemory: localStorage.getItem('use-global-memory') === 'true',
                isStreaming: false,
                activeModal: null,
                pairingToken: '---',
                
                async createNewThread() {
                    try {
                        const res = await fetch('/chat/sessions');
                        const data = await res.json();
                        const sessions = data.sessions || [];
                        
                        let nextNum = 1;
                        sessions.forEach(s => {
                            if (s.id.startsWith('Thread ')) {
                                const num = parseInt(s.id.replace('Thread ', ''));
                                if (!isNaN(num) && num >= nextNum) nextNum = num + 1;
                            }
                        });

                        const newId = `Thread ${nextNum}`;
                        this.currentSessionId = newId;
                        localStorage.setItem('current-session-id', newId);
                        
                        // Switch view to chat if not already there
                        if (this.activeView !== 'chat') {
                            this.activeView = 'chat';
                            htmx.ajax('GET', '/view/chat', '#main-view-container');
                        } else {
                            document.body.dispatchEvent(new CustomEvent('refresh-chat'));
                        }
                        
                        // Refresh threads list
                        document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                    } catch (e) { console.error(e); }
                },

                async openPairingModal(channelType) {
                    this.activeModal = 'pairing';
                    try {
                        const token = document.getElementById('csrf_token')?.value;
                        const res = await fetch('/pair-token', {
                            method: 'POST',
                            headers: { 'X-CSRFToken': token }
                        });
                        const data = await res.json();
                        this.pairingToken = data.token || 'ERROR';
                    } catch (e) { this.pairingToken = 'ERROR'; }
                },
                
                init() {
                    this.applyAccent(this.accent);
                    this.$watch('theme', val => {
                        localStorage.setItem('theme', val);
                        document.documentElement.className = val;
                    });
                    // Initialize HTMX to include CSRF token
                    document.body.addEventListener('htmx:configRequest', (evt) => {
                        const token = document.getElementById('csrf_token')?.value;
                        if (token) evt.detail.headers['X-CSRFToken'] = token;
                    });
                    
                    Alpine.store('viewManager', this);
                    
                    // Handle view changes from HTMX to update activeView
                    document.body.addEventListener('htmx:afterSwap', (evt) => {
                        if (evt.detail.target.id === 'main-view-container') {
                            const newView = evt.detail.pathInfo.requestPath.split('/').pop();
                            if (newView) this.activeView = newView;
                        }
                    });
                },

                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                },

                applyAccent(color) {
                    this.accent = color;
                    localStorage.setItem('accent-color', color);
                    const rgb = this.hexToRgb(color);
                    document.documentElement.style.setProperty('--accent-color', color);
                    document.documentElement.style.setProperty('--accent-rgb', rgb);
                },

                hexToRgb(hex) {
                    const r = parseInt(hex.slice(1,3), 16),
                          g = parseInt(hex.slice(3,5), 16),
                          b = parseInt(hex.slice(5,7), 16);
                    return `${r} ${g} ${b}`;
                },

                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --bg-color: #09090b;
                --sidebar-bg: #121214;
                --card-bg: #18181b;
                --text-primary: #fafafa;
                --text-secondary: #a1a1aa;
                --accent-color: #22c55e;
                --border-color: #27272a;
                --success-color: #10b981;
            }

            .light {
                --bg-color: #f4f4f5;
                --sidebar-bg: #ffffff;
                --card-bg: #ffffff;
                --text-primary: #18181b;
                --text-secondary: #71717a;
                --accent-color: #10b981;
                --border-color: #e4e4e7;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-primary);
                font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            [x-cloak] { display: none !important; }
        }

        @layer components {
            .nav-item {
                @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-zinc-500 hover:bg-white/[0.03] hover:text-zinc-300 transition-all duration-300 cursor-pointer mb-1 text-[13px] font-semibold relative overflow-hidden;
            }
            .nav-item.active {
                background-color: rgb(var(--accent-rgb) / 0.1);
                @apply text-accent;
            }
            .nav-item.active::before {
                content: '';
                @apply absolute left-0 top-1/4 bottom-1/4 w-1 bg-accent rounded-full;
            }
            .stat-card {
                @apply bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl p-6 transition-all hover:border-zinc-700;
            }
            .btn {
                @apply px-5 py-2.5 rounded-lg font-semibold cursor-pointer transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed;
            }
            .btn-primary {
                @apply bg-accent text-white hover:opacity-90;
            }
            .btn-secondary {
                @apply bg-zinc-800 text-white hover:bg-zinc-700;
            }
            .view-header {
                @apply h-16 border-b border-[var(--border-color)] flex items-center justify-between px-4 md:px-8 backdrop-blur-md sticky top-0 z-30;
                background-color: color-mix(in srgb, var(--bg-color), transparent 20%);
            }
            .workspace {
                @apply flex-grow overflow-y-auto p-4 md:p-8 flex flex-col;
                animation: viewEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }

        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex">
    <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
    
    <!-- Sidebar Placeholder -->
    {% include 'agent/_sidebar.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col min-w-0 relative">
        <!-- Sidebar Overlay (Mobile) -->
        <div 
            x-show="sidebarOpen" 
            @click="sidebarOpen = false"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[40] lg:hidden"
            x-cloak
        ></div>

        <div id="main-view-container" class="flex-grow flex flex-col min-h-0">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block modals %}
        <div x-show="activeModal === 'pairing'" x-cloak class="fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4 backdrop-blur-md">
            <div @click.away="activeModal = null" class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-3xl w-full max-w-[500px] p-8 animate-[viewEnter_0.3s_ease-out]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold">Pair a Channel</h3>
                    <button @click="activeModal = null" class="text-zinc-500 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div class="text-center">
                    <div class="text-[10px] font-black uppercase tracking-[0.3em] text-zinc-600 mb-2">Your Pairing Token</div>
                    <div x-text="pairingToken" class="w-full bg-black/40 border border-accent/20 text-accent py-5 rounded-2xl font-mono text-center text-3xl tracking-[0.5em] outline-none my-4 shadow-[0_0_30px_rgba(34,197,94,0.1)]">---</div>
                </div>

                <div class="bg-zinc-800/30 p-5 rounded-2xl text-[13px] border border-zinc-700/50 mt-6">
                    <p class="mb-3 opacity-80">Go to <a href="https://t.me/abdur_angelclaw_bot" target="_blank" class="text-accent font-bold hover:underline">@abdur_angelclaw_bot</a> on Telegram and send:</p>
                    <code class="text-white font-mono break-all text-sm bg-black/40 p-3 rounded-lg block">/pair <span x-text="pairingToken" class="font-bold text-accent"></span></code>
                </div>
                
                <div class="mt-10 flex gap-4">
                    <button class="btn btn-secondary flex-grow" @click="activeModal = null">Close</button>
                    <button class="btn btn-primary flex-grow" @click="openPairingModal()">New Token</button>
                </div>
            </div>
        </div>
    {% endblock %}
</body>
</html>
