<div x-data="apiData()" x-init="init()" class="flex flex-col h-full overflow-hidden">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">API Keys & MCP Servers</h2>
    </div>
</header>
<div class="workspace">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-7xl mx-auto w-full">
        <div class="stat-card">
            <h3 class="font-bold mb-4">API Keys</h3>
            <div x-show="loading" class="flex justify-center py-8">
                <i class="fas fa-spinner fa-spin text-accent"></i>
            </div>
            <div x-show="!loading" class="space-y-3">
                <template x-for="key in apiKeys" :key="key.id">
                    <div class="flex justify-between items-center p-3 bg-white/5 rounded-lg">
                        <div>
                            <div class="font-medium" x-text="key.name"></div>
                            <div class="text-xs text-zinc-500" x-text="key.prefix + '...'"></div>
                        </div>
                        <button @click="revokeKey(key.id)" class="text-zinc-500 hover:text-red-400">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </template>
                <p x-show="apiKeys.length === 0" class="text-zinc-500 text-sm">No API keys.</p>
                <button @click="showNewKeyForm = true" class="btn btn-secondary mt-4">Create Key</button>
            </div>
        </div>
        <div class="stat-card">
            <h3 class="font-bold mb-4">MCP Servers</h3>
            <div x-show="loading" class="flex justify-center py-8">
                <i class="fas fa-spinner fa-spin text-accent"></i>
            </div>
            <div x-show="!loading" class="space-y-3">
                <template x-for="srv in mcpServers" :key="srv.name">
                    <div class="p-3 bg-white/5 rounded-lg">
                        <div class="flex justify-between">
                            <span class="font-medium" x-text="srv.name"></span>
                            <span class="text-xs px-2 py-1 rounded" :class="srv.status === 'running' ? 'bg-green-500/20 text-green-400' : 'bg-zinc-700 text-zinc-400'" x-text="srv.status"></span>
                        </div>
                    </div>
                </template>
                <p x-show="mcpServers.length === 0" class="text-zinc-500 text-sm">No MCP servers configured.</p>
            </div>
        </div>
    </div>
</div>
