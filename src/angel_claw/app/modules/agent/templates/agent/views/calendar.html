<div x-data="calendarData()" x-init="init()" class="flex flex-col h-full overflow-hidden">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Calendar Events</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div class="stat-card">
            <div x-show="loading" class="flex justify-center py-12">
                <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
            </div>
            <div x-show="!loading" class="space-y-3">
                <template x-for="event in events" :key="event.id">
                    <div class="p-4 bg-white/5 border border-white/5 rounded-xl">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-medium" x-text="event.title || event.summary"></div>
                                <div class="text-sm text-zinc-500" x-text="event.start || event.date"></div>
                            </div>
                        </div>
                    </div>
                </template>
                <p x-show="events.length === 0" class="text-zinc-600 italic text-center py-8">No upcoming events.</p>
            </div>
        </div>
    </div>
</div>
