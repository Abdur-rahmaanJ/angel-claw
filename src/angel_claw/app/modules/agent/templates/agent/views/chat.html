<div class="flex flex-col h-full overflow-hidden" 
     x-data="window.chatInterface()" 
     @refresh-chat.window="loadHistory(); Alpine.store('viewManager').isStreaming = false"
     x-init="loadHistory()">
    
    <header class="view-header shrink-0">
        <div class="flex items-center gap-4">
            <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h2 class="font-bold text-lg md:text-xl">Conversation</h2>
            <template x-if="$store.viewManager.currentSessionId !== 'Thread 1'">
                <button 
                    @click.stop="
                        if (confirm('Delete ' + $store.viewManager.currentSessionId + '?')) {
                            fetch('/chat/delete/' + $store.viewManager.currentSessionId, { method: 'POST', headers: { 'X-CSRFToken': document.getElementById('csrf_token')?.value } })
                            .then(() => {
                                $store.viewManager.createNewThread();
                                document.body.dispatchEvent(new CustomEvent('refresh-threads'));
                            });
                        }
                    "
                    class="p-2 text-red-500/50 hover:text-red-500 transition-all ml-2"
                    title="Delete Thread">
                    <i class="fas fa-trash-alt text-xs"></i>
                </button>
            </template>
        </div>
        <div class="flex items-center gap-3">
            <button @click="toggleDevLog()" class="p-2 text-zinc-500 hover:text-accent transition-colors" title="Toggle Developer Log">
                <i class="fas fa-terminal text-[10px]"></i>
            </button>
            <label class="flex items-center cursor-pointer group">
                <span class="mr-2 text-[10px] font-bold text-zinc-500 uppercase tracking-widest group-hover:text-accent transition-colors">Global Memory</span>
                <div class="relative">
                    <input type="checkbox" id="global-memory-toggle" class="sr-only peer" x-model="$store.viewManager.useGlobalMemory" @change="localStorage.setItem('use-global-memory', $store.viewManager.useGlobalMemory)">
                    <div class="w-8 h-4 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-accent peer-checked:after:bg-white"></div>
                </div>
            </label>
        </div>
    </header>

    <div class="flex-1 flex flex-col min-h-0 relative" style="overflow-anchor: none;">
        <!-- Dev Log -->
        <div x-show="devLogOpen" x-transition class="absolute inset-x-0 top-0 h-40 bg-black/90 border-b border-zinc-800 z-20 font-mono text-[9px] p-4 overflow-y-auto">
            <div class="flex justify-between items-center mb-2 border-b border-zinc-800 pb-1">
                <span class="text-zinc-500 uppercase font-black tracking-widest">Live Tool Execution Log</span>
                <button @click="devLogOpen = false" class="text-zinc-500 hover:text-white">CLOSE</button>
            </div>
            <div id="dev-log-content" class="space-y-1 text-zinc-400">
                <template x-for="log in logs">
                    <div x-html="log"></div>
                </template>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="flex-1 overflow-y-auto px-3 md:px-8 py-4 md:py-8 space-y-4 md:space-y-6" id="chat-messages" x-ref="messageContainer" style="overflow-anchor: none;">
            <template x-if="loadingHistory">
                <div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-accent text-2xl"></i></div>
            </template>
            
            <template x-if="!loadingHistory && messages.length === 0">
                <div class="text-center py-20 text-zinc-700 italic">Empty conversation.</div>
            </template>

            <template x-for="(msg, index) in messages" :key="index">
                <div class="max-w-[850px] mx-auto flex gap-3 md:gap-4 animate-[fadeIn_0.3s_ease-out] group/msg">
                    <div class="w-8 h-8 md:w-10 md:h-10 aspect-square rounded-full flex items-center justify-center flex-shrink-0 text-white text-sm md:text-base"
                         :class="msg.role === 'user' ? 'bg-zinc-800' : 'bg-accent'">
                        <i class="fas" :class="msg.role === 'user' ? 'fa-user' : $store.viewManager.assistantIcon"></i>
                    </div>
                    <div class="text-[14px] md:text-[15px] leading-relaxed pt-1 flex-grow overflow-hidden break-words markdown-content relative">
                        <div x-html="formatContent(msg.content)"></div>
                        <template x-if="msg.role === 'assistant'">
                            <div class="mt-2 flex">
                                <button @click="window.copyToClipboard(msg.content, $event)" 
                                        class="p-1.5 text-zinc-600 hover:text-accent transition-colors flex items-center gap-1.5 text-[10px] uppercase font-bold tracking-widest bg-white/5 rounded-md hover:bg-white/10"
                                        title="Copy Markdown">
                                    <i class="fas fa-copy"></i>
                                    <span>Copy Markdown</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
            <!-- Streaming Message -->
            <template x-if="$store.viewManager.isStreaming">
                <div class="max-w-[850px] mx-auto flex gap-3 md:gap-4 group/msg">
                    <div class="w-8 h-8 md:w-10 md:h-10 aspect-square rounded-full bg-accent flex items-center justify-center flex-shrink-0 text-white text-sm md:text-base">
                        <i class="fas" :class="$store.viewManager.assistantIcon"></i>
                    </div>
                    <div class="text-[14px] md:text-[15px] leading-relaxed pt-1 flex-grow overflow-hidden break-words markdown-content relative">
                        <div x-html="formatContent(streamingContent)"></div>
                        <div class="mt-2 flex">
                            <button @click="window.copyToClipboard(streamingContent, $event)" 
                                    class="p-1.5 text-zinc-600 hover:text-accent transition-colors flex items-center gap-1.5 text-[10px] uppercase font-bold tracking-widest bg-white/5 rounded-md hover:bg-white/10"
                                    title="Copy Markdown">
                                <i class="fas fa-copy"></i>
                                <span>Copy Markdown</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Input Area -->
    <div class="px-3 md:px-8 pb-4 md:pb-8 pt-3 md:pt-4 border-t border-[var(--border-color)] bg-[var(--bg-color)] shrink-0">
        <div class="max-w-[850px] mx-auto relative">
            <form @submit.prevent="sendMessage()">
                <textarea 
                    x-model="userInput"
                    @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                    @input="$el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'"
                    class="w-full bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl px-4 pr-12 md:pr-14 py-3 md:py-4 text-[14px] md:text-[15px] focus:border-accent outline-none resize-none min-h-[50px] md:min-h-[60px] max-h-[150px] md:max-h-[200px] transition-all text-white" 
                    placeholder="Ask your agent anything..." 
                    rows="1"
                    :disabled="$store.viewManager.isStreaming"></textarea>
                <button type="submit" 
                        class="absolute right-2 bottom-2 md:bottom-2 w-9 h-9 md:w-10 md:h-10 bg-accent text-white rounded-xl flex items-center justify-center hover:opacity-90 active:scale-95 transition-all disabled:opacity-50"
                        :disabled="!userInput.trim() || $store.viewManager.isStreaming">
                    <i class="fas fa-paper-plane text-sm" x-show="!$store.viewManager.isStreaming"></i>
                    <i class="fas fa-spinner fa-spin text-sm" x-show="$store.viewManager.isStreaming" x-cloak></i>
                </button>
            </form>
        </div>
    </div>
</div>
