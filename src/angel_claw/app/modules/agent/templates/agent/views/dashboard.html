<div x-data="dashboardData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Dashboard Overview</h2>
    </div>
    <div class="flex items-center gap-3">
        <div class="px-3 py-1 bg-accent/10 border border-accent/20 rounded-full flex items-center gap-2">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-accent"></span>
            </span>
            <span class="text-[10px] font-bold text-accent uppercase tracking-widest">System Online</span>
        </div>
    </div>
</header>

<div class="workspace">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
        <div class="stat-card md:col-span-4">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Pending Tasks</div>
            <div class="text-3xl font-bold mb-2" x-text="todosCount">--</div>
            <div class="text-xs text-zinc-500">From <span x-text="todosTotal">0</span> total items</div>
        </div>

        <div class="stat-card md:col-span-4">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Upcoming Events</div>
            <div class="text-3xl font-bold mb-2" x-text="eventsCount">--</div>
            <div class="text-xs text-zinc-500">Next <span x-text="eventsDays">7</span> days window</div>
        </div>

        <div class="stat-card md:col-span-4">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Unread Notes</div>
            <div class="text-3xl font-bold mb-2" x-text="messagesCount">--</div>
            <div class="text-xs text-accent">From <span x-text="messagesRecipients">0</span> recipients</div>
        </div>

        <div class="stat-card md:col-span-12">
            <h3 class="font-bold mb-4">Recent Threads</h3>
            <div class="space-y-2">
                <template x-for="sess in recentSessions.slice(0, 5)" :key="sess.id">
                    <div class="flex items-center justify-between p-3 bg-[var(--card-bg)] rounded-lg">
                        <span class="font-medium" x-text="sess.id"></span>
                        <span class="text-xs text-zinc-500" x-text="sess.updated_at || 'Just now'"></span>
                    </div>
                </template>
                <p x-show="recentSessions.length === 0" class="text-zinc-600 italic text-sm text-center py-4">No threads yet</p>
            </div>
        </div>
    </div>
</div>
