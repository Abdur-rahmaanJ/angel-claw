<div x-data="dashboardData()" x-init="init()" class="flex flex-col h-full overflow-hidden">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Dashboard Overview</h2>
    </div>
</header>

<div class="workspace">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
        <!-- Credits -->
        <div class="stat-card md:col-span-6">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Credits Spent</div>
            <div class="text-3xl font-bold mb-2"><span x-text="credits.lifetime_spent">0</span> / <span x-text="credits.limit">0</span></div>
            <div class="w-full bg-zinc-800 rounded-full h-2 mb-2 overflow-hidden">
                <div class="bg-accent h-2 rounded-full transition-all" :style="`width: ${credits.limit ? (credits.lifetime_spent / credits.limit * 100) : 0}%`"></div>
            </div>
            <div class="text-xs text-zinc-500">
                <span x-text="credits.balance">0</span> remaining
            </div>
        </div>

        <div class="stat-card md:col-span-3">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Pending Tasks</div>
            <div class="text-3xl font-bold mb-2" x-text="todosCount">--</div>
            <div class="text-xs text-zinc-500">From <span x-text="todosTotal">0</span> total</div>
        </div>

        <div class="stat-card md:col-span-3">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Upcoming Events</div>
            <div class="text-3xl font-bold mb-2" x-text="eventsCount">--</div>
            <div class="text-xs text-zinc-500">Next <span x-text="eventsDays">7</span> days</div>
        </div>
    </div>
</div>
