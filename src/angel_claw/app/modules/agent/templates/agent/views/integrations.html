<div x-data="integrationsData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Integrations</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div class="stat-card">
            <h3 class="font-bold mb-4">Connected Channels</h3>
            <div x-show="loading" class="flex justify-center py-12">
                <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
            </div>
            <div x-show="!loading" class="space-y-3">
                <template x-for="ch in channels" :key="ch.identifier">
                    <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-bolt text-accent"></i>
                            <div>
                                <div class="font-medium" x-text="ch.type"></div>
                                <div class="text-xs text-zinc-500" x-text="ch.identifier"></div>
                            </div>
                        </div>
                        <span class="text-xs px-2 py-1 rounded bg-green-500/20 text-green-400">Connected</span>
                    </div>
                </template>
                <p x-show="channels.length === 0" class="text-zinc-500 text-center py-8">No integrations connected.</p>
            </div>
        </div>
        
        <div class="stat-card mt-6">
            <h3 class="font-bold mb-4">Bridge Status</h3>
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full" :class="bridgeOnline ? 'bg-green-400' : 'bg-red-400'"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3" :class="bridgeOnline ? 'bg-green-500' : 'bg-red-500'"></span>
                </span>
                <span :class="bridgeOnline ? 'text-green-400' : 'text-red-400'" x-text="bridgeOnline ? 'Online' : 'Offline'"></span>
            </div>
        </div>
    </div>
</div>
