<div x-data="memoryData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Memory Vault</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div class="stat-card">
            <div x-show="loading" class="flex justify-center py-20">
                <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
            </div>
            <div x-show="!loading" class="space-y-3">
                <template x-for="mem in memories" :key="mem.id">
                    <div class="p-4 bg-white/5 border border-white/5 rounded-xl hover:border-accent/20">
                        <div class="flex justify-between items-start">
                            <div class="font-medium" x-text="mem.payload"></div>
                            <button @click="deleteMemory(mem.id)" class="text-zinc-500 hover:text-red-400">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="text-xs text-zinc-500 mt-1">
                            <span x-text="mem.semantic_type || 'fact'"></span>
                        </div>
                    </div>
                </template>
                <p x-show="memories.length === 0" class="text-zinc-600 italic text-center py-8">No memories stored.</p>
            </div>
        </div>
    </div>
</div>
