<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Memory Vault</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div id="memory-list" hx-get="/chat/memories?format=html" hx-trigger="load" hx-vals='js:{session_id: Alpine.store("viewManager")?.currentSessionId || "Thread 1"}'>
            <div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-accent text-2xl"></i></div>
        </div>
    </div>
</div>
