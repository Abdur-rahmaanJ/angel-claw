<div x-data="messagesData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Messages</h2>
    </div>
</header>

<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div class="stat-card">
            <div x-show="loading" class="flex justify-center py-20">
                <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
            </div>
            
            <div x-show="!loading" class="space-y-2">
                <template x-for="msg in messages" :key="msg.id">
                    <div class="flex items-center gap-4 p-4 bg-white/5 border border-white/5 rounded-xl hover:border-accent/20 transition-colors group">
                        <div class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-user text-accent"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-medium truncate" x-text="msg.sender"></span>
                                <span class="text-xs text-zinc-500 shrink-0" x-text="formatDate(msg.timestamp)"></span>
                            </div>
                            <div class="text-sm text-zinc-400 truncate" x-text="msg.content"></div>
                        </div>
                        <button @click="openMessage(msg)" class="px-3 py-1.5 bg-accent/20 hover:bg-accent text-accent hover:text-white rounded-lg text-sm transition-colors shrink-0">
                            Read
                        </button>
                    </div>
                </template>
                <p x-show="messages.length === 0" class="text-zinc-600 italic text-center py-8">No messages.</p>
            </div>
        </div>
    </div>
</div>

<!-- Message Modal -->
<div x-show="modalOpen" x-cloak class="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4" @click.away="modalOpen = false">
    <div class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl w-full max-w-lg max-h-[80vh] flex flex-col" @click.stop>
        <div class="flex items-center justify-between p-4 border-b border-[var(--border-color)]">
            <div>
                <div class="font-medium" x-text="selectedMessage?.sender"></div>
                <div class="text-xs text-zinc-500" x-text="selectedMessage?.timestamp"></div>
            </div>
            <button @click="modalOpen = false" class="text-zinc-500 hover:text-white p-2">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div class="text-[15px] leading-relaxed whitespace-pre-wrap" x-text="selectedMessage?.content"></div>
        </div>
        <div class="flex justify-between p-4 border-t border-[var(--border-color)]">
            <button @click="deleteMsg(selectedMessage?.id)" class="px-4 py-2 text-red-500 hover:text-red-400 text-sm">
                <i class="fas fa-trash mr-1"></i> Delete
            </button>
            <button @click="markAsRead(selectedMessage?.id)" x-show="selectedMessage && !selectedMessage.is_read" class="px-4 py-2 bg-accent text-white rounded-lg text-sm hover:opacity-90">
                Mark as Read
            </button>
            <button x-show="selectedMessage && selectedMessage.is_read" class="px-4 py-2 bg-zinc-700 text-zinc-400 rounded-lg text-sm cursor-not-allowed" disabled>
                <i class="fas fa-check mr-1"></i> Read
            </button>
        </div>
    </div>
</div>
</div>
