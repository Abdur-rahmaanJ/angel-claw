<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Available Skills</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-7xl mx-auto w-full">
        <div id="skills-list" hx-get="/skills?format=html" hx-trigger="load" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full flex justify-center py-20"><i class="fas fa-spinner fa-spin text-accent text-2xl"></i></div>
        </div>
    </div>
</div>
