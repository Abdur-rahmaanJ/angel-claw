<div x-data="skillsData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Skills</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div x-show="loading" class="flex justify-center py-20">
            <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
        </div>
        
        <div x-show="!loading" class="space-y-4">
            <template x-for="skill in skills" :key="skill.name">
                <div class="stat-card">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <button @click="toggleSkill(skill.name)" 
                                    class="w-10 h-10 rounded-lg flex items-center justify-center transition-colors"
                                    :class="skill.enabled ? 'bg-green-500/20 text-green-500' : 'bg-zinc-800 text-zinc-500'">
                                <i class="fas" :class="skill.enabled ? 'fa-check' : 'fa-times'"></i>
                            </button>
                            <div>
                                <h4 class="font-bold" x-text="skill.name"></h4>
                                <p class="text-sm text-zinc-400" x-text="skill.description"></p>
                            </div>
                        </div>
                        <button x-show="skill.has_config" @click="openConfig(skill)" class="btn btn-secondary text-sm">
                            <i class="fas fa-cog"></i> Config
                        </button>
                    </div>
                </div>
            </template>
            <p x-show="skills.length === 0" class="text-zinc-500 text-center py-8">No skills available.</p>
        </div>
    </div>
</div>

<!-- Skill Config Modal -->
<div x-show="configModal" x-cloak class="fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4">
    <div class="bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl p-6 max-w-md w-full">
        <h3 class="text-lg font-bold mb-4"><span x-text="configSkill?.name"></span> Configuration</h3>
        
        <div class="space-y-4">
            <template x-for="field in configFields" :key="field.name">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 mb-1" x-text="field.name"></label>
                    <input :type="field.type || 'text'" 
                           x-model="field.value"
                           class="w-full bg-[var(--card-bg)] border border-[var(--border-color)] rounded-lg px-3 py-2 text-sm">
                    <p class="text-xs text-zinc-500 mt-1" x-text="field.description"></p>
                </div>
            </template>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button @click="configModal = false" class="flex-1 btn btn-secondary">Cancel</button>
            <button @click="saveConfig()" class="flex-1 btn btn-primary">Save</button>
        </div>
    </div>
</div>
