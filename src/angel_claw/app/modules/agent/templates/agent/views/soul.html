<div x-data="soulData()" x-init="init()">
<header class="view-header">
    <div class="flex items-center gap-4">
        <button class="lg:hidden p-2 -ml-2 text-xl" @click="$store.viewManager.toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h2 class="font-bold text-lg md:text-xl">Core Soul Config</h2>
    </div>
</header>
<div class="workspace">
    <div class="max-w-4xl mx-auto w-full">
        <div class="stat-card">
            <h3 class="font-bold mb-4 uppercase text-[10px] tracking-widest text-zinc-500">System Instruction (Soul)</h3>
            <div x-show="loading" class="flex justify-center py-12">
                <i class="fas fa-spinner fa-spin text-accent text-2xl"></i>
            </div>
            <form x-show="!loading" @submit.prevent="saveSoul()">
                <textarea x-model="soulContent" rows="12" class="w-full bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl px-4 py-3 text-sm focus:border-accent outline-none resize-none" placeholder="Enter system instructions..."></textarea>
                <div class="mt-4 flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-accent text-white rounded-lg hover:opacity-90" :disabled="saving">
                        <i class="fas fa-spinner fa-spin" x-show="saving"></i>
                        <span x-show="!saving">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
